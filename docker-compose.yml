services:
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: otklik-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 20s

  api:
    build:
      context: ./services/api
    container_name: otklik-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      VALKEY_URL: redis://valkey:6379/0
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-otklik-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-otklik-staff}
      TRACK_HMAC_SECRET: ${TRACK_HMAC_SECRET:-}
      RATE_LIMIT_HMAC_SECRET: ${RATE_LIMIT_HMAC_SECRET:-}
      REFRESH_TOKEN_HMAC_SECRET: ${REFRESH_TOKEN_HMAC_SECRET:-}
      APPLICANT_ACCESS_JWT_SECRET: ${APPLICANT_ACCESS_JWT_SECRET:-}
      CONTENT_ENCRYPTION_KEY: ${CONTENT_ENCRYPTION_KEY:-}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_SESSION_TTL_DAYS: ${REFRESH_SESSION_TTL_DAYS:-7}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-otklik_staff_refresh}
      LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      APPLICANT_ACCESS_TTL_MINUTES: ${APPLICANT_ACCESS_TTL_MINUTES:-30}
      APPLICANT_ACCESS_COOKIE_NAME: ${APPLICANT_ACCESS_COOKIE_NAME:-otklik_appeal_access}
      TRACK_ACCESS_RATE_LIMIT_ATTEMPTS: ${TRACK_ACCESS_RATE_LIMIT_ATTEMPTS:-5}
      TRACK_ACCESS_RATE_LIMIT_WINDOW_SECONDS: ${TRACK_ACCESS_RATE_LIMIT_WINDOW_SECONDS:-60}
      APPEAL_SUBMISSION_RATE_LIMIT_ATTEMPTS: ${APPEAL_SUBMISSION_RATE_LIMIT_ATTEMPTS:-10}
      APPEAL_SUBMISSION_RATE_LIMIT_WINDOW_SECONDS: ${APPEAL_SUBMISSION_RATE_LIMIT_WINDOW_SECONDS:-3600}
      ATTACHMENT_STORAGE_PATH: /var/lib/otklik/attachments
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-10485760}
      ATTACHMENT_MAX_COUNT: ${ATTACHMENT_MAX_COUNT:-5}
      ATTACHMENT_MAX_PIXELS: ${ATTACHMENT_MAX_PIXELS:-40000000}
      CRISIS_SUPPORT_TITLE: ${CRISIS_SUPPORT_TITLE:-Помощь в экстренной ситуации}
      CRISIS_SUPPORT_MESSAGE: ${CRISIS_SUPPORT_MESSAGE:-Если прямо сейчас есть угроза жизни или безопасности, обратитесь в местную экстренную службу или к взрослому, которому доверяете.}
      CRISIS_SUPPORT_PHONE: ${CRISIS_SUPPORT_PHONE:-}
      CRISIS_SUPPORT_URL: ${CRISIS_SUPPORT_URL:-}
      CRISIS_SUPPORT_REQUIRES_ORGANIZER_VERIFICATION: ${CRISIS_SUPPORT_REQUIRES_ORGANIZER_VERIFICATION:-true}
      DEMO_OPERATOR_LOGIN: ${DEMO_OPERATOR_LOGIN:-demo_operator}
      DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:-}
      DEMO_EXPERT_LOGIN: ${DEMO_EXPERT_LOGIN:-demo_expert}
      DEMO_EXPERT_PASSWORD: ${DEMO_EXPERT_PASSWORD:-}
      DEMO_ADMIN_LOGIN: ${DEMO_ADMIN_LOGIN:-demo_admin}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - attachment_data:/var/lib/otklik/attachments
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 20s

  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: otklik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8.1.10-alpine
    container_name: otklik-valkey
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    command:
      - valkey-server
      - --appendonly
      - "yes"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  attachment_data:
  postgres_data:
  valkey_data:
